<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Sheldon — Painel de conteúdo</title>
    <link rel="stylesheet" href="/admin/panel.css" />
  </head>
  <body>
    <section class="login" id="login">
      <form class="login-card" id="login-form">
        <h1>Sheldon <span style="color: #d4a32a">·</span> Painel</h1>
        <p class="sub">Entre com o e-mail e a senha combinados.</p>
        <div class="field">
          <label for="email">E-mail</label>
          <input id="email" name="email" type="email" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="password">Senha</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
          />
        </div>
        <p class="note note-error hidden" id="login-error"></p>
        <button class="btn btn-primary" type="submit">Entrar</button>
      </form>
    </section>

    <section class="hidden" id="panel">
      <header class="topbar">
        <div class="brand">Sheldon <span>·</span> Conteúdo</div>
        <div class="spacer"></div>
        <div class="state" id="state">salvo</div>
        <button class="btn btn-sm" id="logout" type="button">Sair</button>
      </header>
      <div class="layout">
        <nav class="sidenav" id="nav"></nav>
        <main class="content" id="doc"></main>
      </div>
    </section>

    <script src="/admin/panel.js"></script>
  </body>
</html>
